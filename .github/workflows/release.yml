# Stockkart Team app: Android release. Builds a signed app bundle (`expo prebuild` + Gradle
# `bundleRelease` with the Play upload key) and uploads it to Google Play. A `v*` tag goes to the
# internal testing track and is attached to a GitHub release; a manual run picks the track
# (`production` is uploaded as a draft). One-time setup: README.md → Releasing.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      track:
        description: Google Play track
        type: choice
        options:
          - internal
          - production
        default: internal

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
  EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
  EXPO_NO_TELEMETRY: 1
  PLAY_TRACK: ${{ inputs.track || 'internal' }}

jobs:
  android:
    name: bundleRelease and upload to Google Play
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Protection rules (required reviewers, allowed branches and tags) are set on this environment.
    environment: release
    steps:
      - name: Check repository variables
        run: |
          missing=0
          for name in EXPO_PUBLIC_API_URL EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository variable $name is not set (README.md → Releasing)."
              missing=1
            fi
          done
          exit "$missing"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack (pnpm 9.8.0)
        run: |
          corepack enable
          corepack prepare pnpm@9.8.0 --activate

      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
          accept-android-sdk-licenses: true

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Version code and name
        run: |
          echo "APP_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "APP_VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "APP_VERSION_NAME=0.0.0-manual.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi

      - name: expo prebuild (android)
        run: pnpm exec expo prebuild --platform android --no-install

      - name: Decode upload keystore
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_UPLOAD_KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_UPLOAD_KEYSTORE_BASE64 is not set (README.md → Releasing)."
            exit 1
          fi
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 -d > android/app/upload.keystore

      - name: Gradle bundleRelease
        working-directory: android
        env:
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          for name in ANDROID_UPLOAD_STORE_PASSWORD ANDROID_UPLOAD_KEY_ALIAS ANDROID_UPLOAD_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is not set (README.md → Releasing)."
              exit 1
            fi
          done
          ./gradlew bundleRelease --no-daemon \
            -PuploadStoreFile=upload.keystore \
            -PuploadStorePassword="$ANDROID_UPLOAD_STORE_PASSWORD" \
            -PuploadKeyAlias="$ANDROID_UPLOAD_KEY_ALIAS" \
            -PuploadKeyPassword="$ANDROID_UPLOAD_KEY_PASSWORD"

      - name: Remove upload keystore
        if: always()
        run: rm -f android/app/upload.keystore

      - uses: actions/upload-artifact@v4
        with:
          name: stockkart-team-${{ env.APP_VERSION_NAME }}-${{ env.APP_VERSION_CODE }}-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: in.stockkart.attendance
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ env.PLAY_TRACK }}
          status: ${{ env.PLAY_TRACK == 'production' && 'draft' || 'completed' }}

      - name: GitHub release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: android/app/build/outputs/bundle/release/app-release.aab
