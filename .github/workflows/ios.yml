# Stockkart Team app: proves the shared code base and the Swift signer module compile for iOS 15.1+
# (HR-module R4.11). Builds for the simulator without signing; nothing is submitted to the App Store.
name: iOS

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

env:
  EXPO_PUBLIC_API_URL: https://ci.invalid/api/v1
  EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ci-placeholder.apps.googleusercontent.com
  EXPO_NO_TELEMETRY: 1

jobs:
  ios:
    name: prebuild, pod install and xcodebuild (simulator)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack (pnpm 9.8.0)
        run: |
          corepack enable
          corepack prepare pnpm@9.8.0 --activate

      - uses: actions/cache@v4
        with:
          path: ~/Library/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - name: expo prebuild (ios)
        run: pnpm prebuild:ios

      - name: pod install
        run: pod install --project-directory=ios

      - name: xcodebuild (simulator, no signing)
        run: >
          xcodebuild -workspace ios/StockkartTeam.xcworkspace -scheme StockkartTeam
          -configuration Debug -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
